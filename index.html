<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07070c">
<title>人生副本 · A LIFE, AND ALL ITS COPIES</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  :root{
    --gold:#d8b26a;--gold-lt:#f0d9a4;--gold-dk:#8a6c33;
    --paper:#ece5d6;--muted:#8b8478;
  }
  body{
    background:#07070c;color:var(--paper);overflow:hidden;
    font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  }

  /* ============ 背景 ============ */
  #bg{position:fixed;inset:0;z-index:0}
  .aurora{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
  .aurora i:nth-child(1){width:62vw;height:62vw;left:-18vw;top:-24vw;
    background:radial-gradient(circle,rgba(92,68,160,.55),transparent 68%);
    animation:dr1 28s ease-in-out infinite alternate}
  .aurora i:nth-child(2){width:54vw;height:54vw;right:-16vw;bottom:-22vw;
    background:radial-gradient(circle,rgba(180,132,60,.40),transparent 68%);
    animation:dr2 34s ease-in-out infinite alternate}
  .aurora i:nth-child(3){width:42vw;height:42vw;left:36vw;top:42vh;
    background:radial-gradient(circle,rgba(46,104,146,.30),transparent 70%);
    animation:dr1 40s ease-in-out infinite alternate-reverse}
  @keyframes dr1{from{transform:translate(0,0) scale(1)}to{transform:translate(6vw,5vh) scale(1.15)}}
  @keyframes dr2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-7vw,-4vh) scale(.92)}}

  /* ============ 屏幕 ============ */
  .screen{
    position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;
    overflow-y:auto;overflow-x:hidden;
    opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s;
  }
  .screen.on{opacity:1;visibility:visible}
  .wrap{margin:auto;width:100%;max-width:960px;padding:52px 28px}

  /* ============ 封面 ============ */
  .cover-wrap{margin:auto;width:100%;max-width:840px;padding:48px 26px;text-align:center;position:relative}
  .ornament{
    position:absolute;left:50%;top:50%;width:min(118vw,880px);height:min(118vw,880px);
    transform:translate(-50%,-50%);opacity:.55;pointer-events:none;z-index:-1;
    animation:spin 180s linear infinite;
  }
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .kicker{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:10px;letter-spacing:.46em;color:#a98f5a;text-transform:uppercase;
    margin-bottom:40px;animation:up 1.1s .1s both;
  }
  .cover-title{
    font-size:clamp(52px,11vw,108px);letter-spacing:.18em;text-indent:.18em;
    line-height:1.06;font-weight:400;
    background:linear-gradient(172deg,#fffaf0 0%,#f3e3bb 30%,#d8b26a 58%,#9c7b3c 82%,#7a5f28 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 80px rgba(216,178,106,.20);
    animation:up 1.3s .25s both;
  }
  .cover-sub{
    margin-top:22px;font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:clamp(9px,1.6vw,11px);letter-spacing:.52em;color:#8d8064;
    text-indent:.52em;animation:up 1.3s .4s both;
  }
  .rule{
    width:60px;height:1px;margin:40px auto;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    animation:up 1.3s .5s both;
  }
  .cover-desc{
    font-size:clamp(14px,2.4vw,16px);line-height:2.3;letter-spacing:.08em;
    color:#9b9384;animation:up 1.3s .6s both;
  }
  .cover-desc b{color:#d8b26a;font-weight:400}
  .cover-meta{
    margin-top:46px;font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:10px;letter-spacing:.34em;color:#4e4a42;animation:up 1.3s .95s both;
  }
  @keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

  /* ============ 按钮 ============ */
  .btn{
    position:relative;display:inline-block;overflow:hidden;
    padding:17px 58px;margin-top:46px;
    font-family:inherit;font-size:15px;letter-spacing:.36em;text-indent:.36em;
    color:var(--gold-lt);background:rgba(216,178,106,.045);
    border:1px solid rgba(216,178,106,.42);border-radius:2px;cursor:pointer;
    transition:all .45s cubic-bezier(.2,.8,.3,1);
    animation:up 1.3s .8s both;
  }
  .btn::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 30%,rgba(240,217,164,.30),transparent 70%);
    transform:translateX(-130%);transition:transform .8s ease;
  }
  .btn:hover{
    color:#fff8e8;border-color:rgba(240,217,164,.9);
    box-shadow:0 0 40px rgba(216,178,106,.30),inset 0 0 30px rgba(216,178,106,.10);
    transform:translateY(-2px);
  }
  .btn:hover::before{transform:translateX(130%)}
  .btn:active{transform:translateY(0)}

  /* ============ 游戏 HUD ============ */
  .hud{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
  .hud-l{display:flex;align-items:baseline;gap:7px;font-family:"Helvetica Neue",Arial,sans-serif}
  .hud-num{font-size:22px;letter-spacing:.06em;color:var(--gold);font-weight:300}
  .hud-total{font-size:11px;letter-spacing:.18em;color:#5c574e}
  .hud-ch{font-size:12px;letter-spacing:.28em;color:#8a7d5f}
  .track{height:1px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;margin-bottom:52px}
  .track i{
    position:absolute;left:0;top:0;height:100%;width:0;
    background:linear-gradient(90deg,#7a5f28,#d8b26a,#f0d9a4);
    box-shadow:0 0 16px rgba(240,217,164,.7);
    transition:width .6s cubic-bezier(.2,.8,.3,1);
  }

  /* ============ 题干 ============ */
  .qcard{display:flex;gap:26px;margin-bottom:46px;align-items:flex-start}
  .qmark{
    flex:0 0 auto;font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;letter-spacing:.14em;color:#6b6046;padding-top:11px;position:relative;
  }
  .qmark::after{
    content:"";position:absolute;right:-13px;top:6px;bottom:6px;width:1px;
    background:linear-gradient(180deg,var(--gold),transparent);opacity:.5;
  }
  .qtext{
    font-size:clamp(21px,3.7vw,31px);line-height:1.72;letter-spacing:.05em;
    font-weight:400;color:#f2ece0;animation:qin .7s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes qin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  /* ============ 选项 ============ */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{
    display:flex;align-items:center;gap:16px;padding:17px 20px;text-align:left;
    font-family:inherit;font-size:15px;line-height:1.55;letter-spacing:.03em;
    color:#b5ae9f;background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.065);border-radius:3px;
    cursor:pointer;position:relative;overflow:hidden;
    transition:all .34s cubic-bezier(.2,.8,.3,1);
    opacity:0;animation:opin .55s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes opin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .opt::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);
    transform:scaleY(0);transform-origin:center;transition:transform .35s ease;
  }
  .oi{
    flex:0 0 auto;font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:10px;letter-spacing:.14em;color:#57534a;transition:color .3s;
  }
  .opt:hover{
    color:#fff6e4;background:rgba(216,178,106,.075);
    border-color:rgba(216,178,106,.45);transform:translateX(4px);
    box-shadow:0 8px 34px rgba(0,0,0,.45),inset 0 0 26px rgba(216,178,106,.05);
  }
  .opt:hover::before{transform:scaleY(1)}
  .opt:hover .oi{color:var(--gold)}
  .opt.sel{
    color:#fff8e8;background:rgba(216,178,106,.16);
    border-color:rgba(240,217,164,.92);
    box-shadow:0 0 36px rgba(216,178,106,.34),inset 0 0 28px rgba(216,178,106,.14);
    transform:translateX(4px);
  }
  .opt.sel::before{transform:scaleY(1)}
  .opt.sel .oi{color:#f0d9a4}
  .opt.fade{opacity:.14 !important;transform:none !important;filter:blur(.4px)}
  .opt:disabled{cursor:default}

  /* ============ 分支浮层 ============ */
  .branch{
    position:fixed;left:50%;bottom:0;z-index:8;width:100%;max-width:680px;
    padding:22px 30px 26px;
    background:linear-gradient(180deg,rgba(14,13,20,.94),rgba(9,9,14,.99));
    border-top:1px solid rgba(216,178,106,.30);border-radius:6px 6px 0 0;
    backdrop-filter:blur(20px);transform:translate(-50%,115%);
    transition:transform .6s cubic-bezier(.2,.85,.25,1);
    box-shadow:0 -20px 60px rgba(0,0,0,.6);
  }
  .branch.show{transform:translate(-50%,0)}
  .branch-label{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:9px;letter-spacing:.42em;color:#8a7748;margin-bottom:12px;text-transform:uppercase;
  }
  .branch-text{font-size:15px;line-height:1.8;letter-spacing:.05em;color:#e2d6bc}
  .branch-text em{font-style:normal;color:#f0d9a4}

  /* ============ 结果页 ============ */
  .r-head{text-align:center;margin-bottom:52px}
  .r-id{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:10px;letter-spacing:.4em;color:#6b6046;margin-bottom:26px;
  }
  .r-id b{color:var(--gold);font-weight:400;letter-spacing:.22em}
  .r-title{
    font-size:clamp(27px,5.4vw,44px);font-weight:400;line-height:1.5;letter-spacing:.08em;
    background:linear-gradient(172deg,#fffaf0,#f3e3bb 40%,#d8b26a 72%,#a5863f);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .r-sub{margin-top:18px;font-size:13px;letter-spacing:.26em;color:#7d7565}

  .panel{
    border:1px solid rgba(255,255,255,.055);border-radius:4px;
    background:rgba(255,255,255,.014);padding:34px 30px;margin-bottom:34px;
  }
  .panel-label{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:9px;letter-spacing:.42em;color:#8a7748;margin-bottom:26px;text-transform:uppercase;
  }
  .radar-box{display:flex;justify-content:center;margin-bottom:26px}
  .radar{width:100%;max-width:340px;height:auto;overflow:visible}

  .dims{display:flex;flex-direction:column;gap:13px;margin-top:8px}
  .dim{display:flex;align-items:center;gap:14px}
  .dim-name{flex:0 0 46px;text-align:right;font-size:12.5px;letter-spacing:.14em;color:#9a9284}
  .dim-track{flex:1;height:3px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
  .dim-track i{display:block;height:100%;width:0;border-radius:2px;transition:width 1.4s cubic-bezier(.2,.85,.25,1)}
  .dim-val{flex:0 0 30px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:#615c53}

  .alt-list{display:flex;flex-direction:column;gap:11px}
  .alt{
    padding:19px 22px;border-radius:3px;background:rgba(255,255,255,.016);
    border:1px solid rgba(255,255,255,.05);border-left:2px solid rgba(216,178,106,.30);
    transition:all .4s;
  }
  .alt:hover{background:rgba(216,178,106,.04);border-left-color:rgba(216,178,106,.85)}
  .alt-q{font-size:12.5px;line-height:1.7;color:#7b7466;letter-spacing:.05em;margin-bottom:12px}
  .alt-row{display:flex;gap:12px;font-size:14px;line-height:1.85;letter-spacing:.03em}
  .alt-tag{
    flex:0 0 66px;font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:9px;letter-spacing:.2em;color:#57534a;padding-top:5px;
  }
  .alt-a{color:#a39c8e}
  .alt-b{color:#e8d3a3}

  .letter{border-left:1px solid rgba(216,178,106,.26);padding:4px 0 4px 30px;margin:0 0 52px}
  .letter p{font-size:15.5px;line-height:2.35;letter-spacing:.045em;color:#c2baac;margin-bottom:24px}
  .letter p:last-of-type{margin-bottom:0}
  .letter em{font-style:normal;color:#eedaab}
  .letter .strong{color:#f3e6c8}
  .sign{text-align:right;font-size:12.5px;letter-spacing:.24em;color:#7a6a44;margin-top:36px}

  /* 截图引导 */
  .share{
    border:1px solid rgba(216,178,106,.24);border-radius:5px;
    background:linear-gradient(180deg,rgba(216,178,106,.055),rgba(216,178,106,.012));
    padding:34px 28px;margin-bottom:34px;text-align:center;
  }
  .share-label{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:9px;letter-spacing:.42em;color:#8a7748;margin-bottom:20px;text-transform:uppercase;
  }
  .share p{font-size:14.5px;line-height:2;letter-spacing:.06em;color:#b8b0a2;margin-bottom:24px}
  .share p b{color:#eedaab;font-weight:400}
  .share-card{
    display:inline-block;min-width:230px;padding:22px 34px;margin-bottom:24px;
    border:1px solid rgba(216,178,106,.45);border-radius:4px;
    background:rgba(8,8,14,.55);
    box-shadow:0 0 40px rgba(216,178,106,.12) inset;
  }
  .sc-id{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:10px;letter-spacing:.38em;color:#8a7748;margin-bottom:12px;
  }
  .sc-title{font-size:16px;letter-spacing:.1em;color:#f0d9a4}
  .copy-btn{
    display:inline-block;padding:13px 34px;
    font-family:inherit;font-size:13px;letter-spacing:.24em;text-indent:.24em;
    color:#e8d3a3;background:rgba(216,178,106,.06);
    border:1px solid rgba(216,178,106,.45);border-radius:2px;cursor:pointer;
    transition:all .4s;
  }
  .copy-btn:hover{color:#fff8e8;border-color:rgba(240,217,164,.9);background:rgba(216,178,106,.14)}
  .copy-tip{margin-top:14px;font-size:11px;letter-spacing:.2em;color:#6b6046;min-height:16px}

  .r-btn{display:block;margin:0 auto 34px;animation:none}

  /* 滚动条 */
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(216,178,106,.20);border-radius:4px}

  /* ============ 响应式 ============ */
  @media (max-width:760px){
    .wrap{padding:36px 20px}
    .cover-wrap{padding:36px 20px}
    .opts{grid-template-columns:1fr;gap:9px}
    .opt{padding:14px 16px;font-size:14.5px;gap:13px}
    .qcard{gap:20px;margin-bottom:32px}
    .qtext{font-size:20px;line-height:1.68}
    .track{margin-bottom:36px}
    .hud-num{font-size:19px}
    .panel{padding:26px 18px}
    .letter{padding-left:20px;margin-bottom:42px}
    .letter p{font-size:14.5px;line-height:2.25;margin-bottom:20px}
    .branch{padding:18px 22px 22px}
    .branch-text{font-size:14px}
    .alt-tag{flex:0 0 58px}
    .dim-name{flex:0 0 42px;font-size:11.5px}
    .share{padding:28px 18px}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="aurora"><i></i><i></i><i></i></div>

<!-- ================= 封面 ================= -->
<section class="screen on" id="coverScreen">
  <div class="cover-wrap">
    <svg class="ornament" viewBox="0 0 800 800" fill="none">
      <circle cx="400" cy="400" r="336" stroke="rgba(216,178,106,.10)" stroke-width="1"/>
      <circle cx="400" cy="400" r="286" stroke="rgba(216,178,106,.06)" stroke-width="1" stroke-dasharray="2 7"/>
      <circle cx="400" cy="400" r="236" stroke="rgba(216,178,106,.08)" stroke-width="1"/>
      <circle cx="400" cy="400" r="176" stroke="rgba(216,178,106,.055)" stroke-width="1" stroke-dasharray="1 6"/>
      <circle cx="400" cy="400" r="112" stroke="rgba(216,178,106,.05)" stroke-width="1"/>
      <g stroke="rgba(216,178,106,.13)" stroke-width="1">
        <line x1="400" y1="58" x2="400" y2="128"/>
        <line x1="400" y1="672" x2="400" y2="742"/>
        <line x1="58" y1="400" x2="128" y2="400"/>
        <line x1="672" y1="400" x2="742" y2="400"/>
        <line x1="158" y1="158" x2="207" y2="207"/>
        <line x1="593" y1="593" x2="642" y2="642"/>
        <line x1="642" y1="158" x2="593" y2="207"/>
        <line x1="207" y1="593" x2="158" y2="642"/>
      </g>
      <g fill="rgba(216,178,106,.55)">
        <circle cx="400" cy="68" r="2.4"/><circle cx="400" cy="732" r="2.4"/>
        <circle cx="68" cy="400" r="2.4"/><circle cx="732" cy="400" r="2.4"/>
        <circle cx="166" cy="166" r="1.8"/><circle cx="634" cy="634" r="1.8"/>
        <circle cx="634" cy="166" r="1.8"/><circle cx="166" cy="634" r="1.8"/>
      </g>
      <circle cx="400" cy="64" r="4" fill="rgba(240,217,164,.75)"/>
    </svg>

    <p class="kicker">Stanford Life Design · Interactive Edition</p>
    <h1 class="cover-title">人生副本</h1>
    <p class="cover-sub">A LIFE, AND ALL ITS COPIES</p>
    <div class="rule"></div>
    <p class="cover-desc">
      五十个人生路口，四百种选择。<br>
      每一次按下，都会长出一个<b>新的副本</b>。<br>
      你会在这里看见——<br>
      自己是怎么一步一步，成为自己的。
    </p>
    <button class="btn" id="startBtn">进入副本</button>
    <p class="cover-meta">50 个路口 · 每路口 8 种选择 · 1 次重启</p>
  </div>
</section>

<!-- ================= 游戏 ================= -->
<section class="screen" id="gameScreen">
  <div class="wrap">
    <div class="hud">
      <div class="hud-l">
        <span class="hud-num" id="hudNum">01</span>
        <span class="hud-total">/ 50</span>
      </div>
      <div class="hud-ch" id="hudCh">序章 · 启程</div>
    </div>
    <div class="track"><i id="trackFill"></i></div>

    <div class="qcard">
      <div class="qmark" id="qMark">01</div>
      <h2 class="qtext" id="qText"></h2>
    </div>

    <div class="opts" id="opts"></div>
  </div>
</section>

<!-- ================= 分支浮层 ================= -->
<div class="branch" id="branch">
  <div class="branch-label">在另一个副本里</div>
  <div class="branch-text" id="branchText"></div>
</div>

<!-- ================= 结果 ================= -->
<section class="screen" id="resultScreen">
  <div class="wrap" id="resultWrap"></div>
</section>

<script>
/* =========================================================
   0. 维度定义
   ========================================================= */
const DIMS = [
  {k:'c', n:'勇气', color:'#e2574c'},
  {k:'w', n:'智慧', color:'#4fb0c6'},
  {k:'r', n:'连接', color:'#d96a9a'},
  {k:'h', n:'健康', color:'#7bbf6a'},
  {k:'k', n:'创造', color:'#e0b74a'},
  {k:'m', n:'丰盛', color:'#c98a4b'},
  {k:'n', n:'意义', color:'#8f7ee0'},
  {k:'f', n:'自由', color:'#4a8fd4'}
];

/* =========================================================
   1. 50 个路口 · 每个路口 8 种选择
   格式：[选项文字, 维度影响]
   ========================================================= */
const QS = [
/* ---------- 序章 · 启程 ---------- */
{t:'六岁那年，大人们笑着问你：「长大以后想做什么呀？」',o:[
  ['大声说出了一个梦想','c3'],
  ['说「不知道」，然后真的开始想','w3'],
  ['说了一个大人爱听的答案','m2w1'],
  ['说「想和爸爸妈妈一样」','r3'],
  ['说「想造一个会飞的东西」','k3'],
  ['说「想去看海」','f3'],
  ['说「想帮到别人」','n3'],
  ['低下头，什么也没说','h2w1']
]},
{t:'十岁的暑假，漫长得像一整个世纪。',o:[
  ['泡在图书馆里','w3'],
  ['在楼下踢球到天黑','h2r1'],
  ['一个人骑车去很远的地方','f3'],
  ['报了个画画班','k3'],
  ['帮邻居奶奶干活','n2r1'],
  ['学会了做一桌菜','h2k1'],
  ['打了一整个夏天的游戏','k1f2'],
  ['跟着父母去了一趟远方','r2f1']
]},
{t:'十五岁，你的成绩中等，不上不下。',o:[
  ['熬夜补课，往上冲','c3w1'],
  ['接受自己，专心做喜欢的事','n2f1'],

/* =========================================================
   2. 章节
   ========================================================= */
const CHAPTERS = [
  {to:9,  name:'序章 · 启程'},
  {to:19, name:'第一章 · 入世'},
  {to:29, name:'第二章 · 跋涉'},
  {to:39, name:'第三章 · 转场'},
  {to:49, name:'终章 · 回望'}
];
function chapterOf(i){
  return (CHAPTERS.find(c => i <= c.to) || CHAPTERS[CHAPTERS.length-1]).name;
}

/* =========================================================
   4. 星空背景
   ========================================================= */
(function(){
  const cv = document.getElementById('bg');
  const ctx = cv.getContext('2d');
  let stars = [];

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr;
    cv.height = innerHeight * dpr;
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(260, Math.floor(innerWidth * innerHeight / 7600));
    stars = Array.from({length:n}, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: Math.random() * 1.25 + 0.22,
      a: Math.random() * Math.PI * 2,
      s: Math.random() * 0.016 + 0.004,
      v: Math.random() * 0.15 + 0.02
    }));
  }

  function loop(){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for(const st of stars){
      st.a += st.s;
      st.y -= st.v;
      if(st.y < -8){ st.y = innerHeight + 8; st.x = Math.random() * innerWidth; }
      const alpha = 0.14 + Math.abs(Math.sin(st.a)) * 0.62;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(234,226,208,' + alpha.toFixed(3) + ')';
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }

  resize();
  addEventListener('resize', resize);
  loop();
})();

/* =========================================================
   5. 工具函数
   ========================================================= */
const $ = id => document.getElementById(id);

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  const el = $(id);
  el.classList.add('on');
  el.scrollTop = 0;
}

function parseEffect(str){
  const out = {};
  (str || '').replace(/([a-z])(\d+)/g, (_, k, v) => {
    out[k] = (out[k] || 0) + parseInt(v, 10);
    return '';
  });
  return out;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =========================================================
   6. 游戏状态
   ========================================================= */
let S = null;

function resetState(){
  S = {
    i: 0,
    scores: Object.fromEntries(DIMS.map(d => [d.k, 0])),
    answers: [],
    lock: false
  };
}

/* =========================================================
   7. 渲染题目
   ========================================================= */
function renderQuestion(){
  const q = QS[S.i];

  $('hudNum').textContent = String(S.i + 1).padStart(2, '0');
  $('hudCh').textContent = chapterOf(S.i);
  $('trackFill').style.width = (S.i / QS.length * 100) + '%';
  $('qMark').textContent = String(S.i + 1).padStart(2, '0');

  const qt = $('qText');
  qt.textContent = q.t;
  qt.style.animation = 'none';
  void qt.offsetWidth;
  qt.style.animation = '';

  const box = $('opts');
  box.innerHTML = '';
  q.o.forEach((opt, idx) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.style.animationDelay = (idx * 36) + 'ms';
    b.innerHTML = '<span class="oi">' + String(idx + 1).padStart(2, '0') +
                  '</span><span class="ot"></span>';
    b.querySelector('.ot').textContent = opt[0];
    b.addEventListener('click', () => choose(idx));
    box.appendChild(b);
  });

  S.lock = false;
}

/* =========================================================
   8. 选择处理
   ========================================================= */
function choose(idx){
  if(S.lock) return;
  S.lock = true;

  const q = QS[S.i];
  const btns = Array.from(document.querySelectorAll('.opt'));

  btns.forEach((b, j) => {
    b.disabled = true;
    if(j === idx) b.classList.add('sel');
    else b.classList.add('fade');
  });

  const eff = parseEffect(q.o[idx][1]);
  for(const k in eff) S.scores[k] += eff[k];

  S.answers.push(idx);

  // 另一条路
  const others = q.o.map((_, j) => j).filter(j => j !== idx);
  const pick = others[Math.floor(Math.random() * others.length)];
  $('branchText').innerHTML = '你会选择 <em>「' + q.o[pick][0] + '」</em>';
  $('branch').classList.add('show');

  setTimeout(() => {
    $('branch').classList.remove('show');
    S.i++;
    if(S.i >= QS.length){
      showResult();
    } else {
      renderQuestion();
      $('gameScreen').scrollTop = 0;
    }
  }, 1600);
}

/* =========================================================
   9. 雷达图
   ========================================================= */
function radarSVG(sc){
  const n = DIMS.length, cx = 150, cy = 150, R = 100;
  const max = Math.max(...DIMS.map(d => sc[d.k]), 1);

  let grid = '';
  for(let ring = 1; ring <= 4; ring++){
    const r = R * ring / 4;
    const pts = DIMS.map((_, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n;
      return (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1);
    }).join(' ');
    grid += '<polygon points="' + pts + '" fill="none" stroke="rgba(216,178,106,' +
            (0.06 + ring * 0.028).toFixed(3) + ')" stroke-width="1"/>';
  }

  let spokes = '';
  DIMS.forEach((_, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    spokes += '<line x1="' + cx + '" y1="' + cy + '" x2="' +
      (cx + R * Math.cos(a)).toFixed(1) + '" y2="' +
      (cy + R * Math.sin(a)).toFixed(1) +
      '" stroke="rgba(216,178,106,.11)" stroke-width="1"/>';
  });

  const pts = DIMS.map((d, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    const v = Math.max(sc[d.k] / max, 0.08);
    return [cx + R * v * Math.cos(a), cy + R * v * Math.sin(a)];
  });

  const poly = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

  let dots = '';
  pts.forEach((p, i) => {
    dots += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) +
            '" r="2.6" fill="' + DIMS[i].color + '"/>';
  });

  let labels = '';
  DIMS.forEach((d, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    const lx = cx + (R + 25) * Math.cos(a);
    const ly = cy + (R + 25) * Math.sin(a);
    labels += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) +
      '" text-anchor="middle" font-size="10" fill="#9a9186" letter-spacing="1.4" ' +
      'font-family="Songti SC, serif">' + d.n + '</text>';
  });

  return '<svg viewBox="0 0 300 300" class="radar">' +
    '<defs><radialGradient id="rg" cx="50%" cy="50%" r="50%">' +
      '<stop offset="0%" stop-color="rgba(216,178,106,.36)"/>' +
      '<stop offset="100%" stop-color="rgba(216,178,106,.04)"/>' +
    '</radialGradient></defs>' +
    grid + spokes +
    '<polygon points="' + poly + '" fill="url(#rg)" stroke="rgba(240,217,164,.9)" ' +
      'stroke-width="1.4" stroke-linejoin="round"/>' +
    dots + labels +
  '</svg>';
}

/* =========================================================
   10. 结果页
   ========================================================= */
function showResult(){
  const entries = DIMS
    .map(d => ({...d, v: S.scores[d.k]}))
    .sort((a, b) => b.v - a.v);

  const top = entries[0];
  const second = entries[1];
  const max = Math.max(top.v, 1);

  // 副本编号：根据答案生成稳定哈希
  let h = 0;
  S.answers.forEach((a, i) => {
    h = (h * 37 + a * (i + 11) + i * 7) % 1679616;
  });
  const code = h.toString(36).toUpperCase().padStart(4, '0');

  // 维度条
  let dimHTML = '';
  entries.forEach(d => {
    dimHTML +=
      '<div class="dim">' +
        '<span class="dim-name">' + d.n + '</span>' +
        '<div class="dim-track"><i data-w="' + Math.round(d.v / max * 100) +
          '" style="background:linear-gradient(90deg,' + d.color + '55,' + d.color + ')"></i></div>' +
        '<span class="dim-val">' + d.v + '</span>' +
      '</div>';
  });

  // 随机 5 题：你选了 vs 另一条路
  const pool = shuffle(QS.map((_, i) => i)).slice(0, 5).sort((a, b) => a - b);
  let altHTML = '';
  pool.forEach(i => {
    const q = QS[i];
    const chosen = S.answers[i];
    const others = q.o.map((_, j) => j).filter(j => j !== chosen);
    const alt = others[Math.floor(Math.random() * others.length)];
    altHTML +=
      '<div class="alt">' +
        '<div class="alt-q">第 ' + String(i + 1).padStart(2, '0') + ' 幕 · ' + q.t + '</div>' +
        '<div class="alt-row"><span class="alt-tag">你选了</span>' +
          '<span class="alt-a">' + q.o[chosen][0] + '</span></div>' +
        '<div class="alt-row"><span class="alt-tag">另一条路</span>' +
          '<span class="alt-b">' + q.o[alt][0] + '</span></div>' +
      '</div>';
  });

  const title = TITLES[top.k];
  const secondLine = SECOND[second.k];

  const html =
    '<div class="r-head">' +
      '<div class="r-id">副本编号 &nbsp;<b>No. ' + code + '</b></div>' +
      '<h2 class="r-title">' + title.t + '</h2>' +
      '<p class="r-sub">五十个路口走完，你成为了你</p>' +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-label">Your Life Blueprint</div>' +
      '<div class="radar-box">' + radarSVG(S.scores) + '</div>' +
      '<div class="dims">' + dimHTML + '</div>' +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-label">If You Had Chosen Otherwise</div>' +
      '<div class="alt-list">' + altHTML + '</div>' +
    '</div>' +

    '<div class="letter">' +
      '<p>你走完了五十个路口。<br>' +
      '你做出了 <em>五十次选择</em>，也放下了 <em>三百五十种可能</em>。</p>' +

      '<p>' + title.l + '</p>' +
      '<p>' + secondLine + '</p>' +

      '<p>你以为自己只是在做一个又一个具体的决定：' +
      '去哪所学校，接哪份工作，爱哪个人，走哪条路。<br>' +
      '但后来你发现，你其实一直在回答同一个问题——<br>' +
      '<span class="strong">「我到底想成为什么样的人。」</span></p>' +

      '<p>有些答案，你说得很坚定。<br>' +
      '有些答案，是咬着牙说出来的。<br>' +
      '还有些答案，你到现在也没想明白。</p>' +

      '<p>没关系。</p>' +

      '<p>人生不是一道需要被答对的题。<br>' +
      '它是一份设计草案，永远在改，永远没有终稿。</p>' +

      '<p>你会在某个深夜想起那些没走的副本，想起另一个自己——<br>' +
      '那个人可能更勇敢，更富有，更自由，也可能更孤独。</p>' +

      '<p>但那个人不是你。</p>' +

      '<p>你之所以是你，不是因为你都选对了，' +
      '而是因为你选了，然后承担了。<br>' +
      '你为每一次选择付出的代价，构成了你现在的形状。</p>' +

      '<p>所以，不必回头。</p>' +

      '<p><span class="strong">你现在站的地方，<br>' +
      '是你走了很久很久，才走到的地方。</span></p>' +

      '<p>而这，已经足够好了。</p>' +

      '<div class="sign">—— 写给正在读这封信的你</div>' +
    '</div>' +

    '<div class="share">' +
      '<div class="share-label">Share Your Copy</div>' +
      '<p>截图你的<b>副本编号 + 称号</b>，发到评论区，<br>' +
      '看看有多少人和你走在同一条路上。</p>' +
      '<div class="share-card">' +
        '<div class="sc-id">NO. ' + code + '</div>' +
        '<div class="sc-title">' + title.t + '</div>' +
      '</div><br>' +
      '<button class="copy-btn" id="copyBtn">复制我的副本文案</button>' +
      '<div class="copy-tip" id="copyTip"></div>' +

  $('resultWrap').innerHTML = html;
  showScreen('resultScreen');

  setTimeout(() => {
    document.querySelectorAll('.dim-track i').forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
  }, 420);

  // 复制文案
  const shareText = '我在《人生副本》里走到了 No.' + code + ' · ' + title.t +
                    '。你呢？';
  $('copyBtn').addEventListener('click', () => {
    const done = () => {
      $('copyTip').textContent = '已复制，去评论区粘贴吧';
      setTimeout(() => { $('copyTip').textContent = ''; }, 2600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(shareText).then(done).catch(() => fallbackCopy(shareText, done));
    } else {
      fallbackCopy(shareText, done);
    }
  });

  $('restartBtn').addEventListener('click', restart);
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){}
  document.body.removeChild(ta);
}

/* =========================================================
   11. 开始 / 重启
   ========================================================= */
function startGame(){
  resetState();
  $('branch').classList.remove('show');
  showScreen('gameScreen');
  renderQuestion();
}

function restart(){
  $('branch').classList.remove('show');
  $('resultWrap').innerHTML = '';
  resetState();
  showScreen('coverScreen');
}

$('startBtn').addEventListener('click', startGame);

/* 键盘 1-8 快速选择 */
document.addEventListener('keydown', e => {
  if(!$('gameScreen').classList.contains('on')) return;
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= 8){
    const btns = document.querySelectorAll('.opt');
    if(btns[n - 1] && !btns[n - 1].disabled) btns[n - 1].click();
  }
});
